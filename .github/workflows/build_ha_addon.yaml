name: Build HA addon

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'
      - 'codex/**'

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: riden_rd60xx_home_assistant_addon

permissions:
  contents: read

concurrency:
  group: addon-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r riden_rd60xx_home_assistant_addon/requirements.txt
      - run: python -B -m unittest discover -s tests -v

  init:
    name: Initialize build
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.config.outputs.version }}
      registry-prefix: ${{ steps.config.outputs.registry-prefix }}
    steps:
      - uses: actions/checkout@v6

      - name: Read add-on version and registry namespace
        id: config
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python -m pip install PyYAML==6.0.3
          version=$(python -c "import yaml; print(yaml.safe_load(open('riden_rd60xx_home_assistant_addon/config.yaml'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry-prefix=ghcr.io/${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ steps.config.outputs.registry-prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [test, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push built images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          context: riden_rd60xx_home_assistant_addon
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cosign: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push the manifest to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ needs.init.outputs.registry-prefix }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

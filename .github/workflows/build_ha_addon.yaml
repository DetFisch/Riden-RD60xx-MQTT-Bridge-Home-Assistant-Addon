name: Add-on images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.addons.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/scripts/test_addon_images.py
      - name: Read versions, architectures and build settings
        id: addons
        run: echo "matrix=$(python .github/scripts/addon_images.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.path }} (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch != 'amd64' && matrix.arch != 'aarch64'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push commit image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            ${{ matrix.build_args }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ matrix.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Sign commit image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        run: bash .github/scripts/sign_image.sh "$IMAGE_REF"

  publish:
    name: Publish immutable releases
    needs: [metadata, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Publish version and latest after all architectures pass
        env:
          SIGN_IMAGES: "true"
        run: python .github/scripts/addon_images.py publish

  test:
    name: Test bridge
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r riden_rd60xx_home_assistant_addon/requirements.txt
    - run: python -B -m unittest discover -s tests -v
